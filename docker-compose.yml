services:
  db:
    image: postgres:18
    container_name: fluxarte-db
    environment:
      POSTGRES_DB: fluxarte
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - fluxarte-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fluxarte-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-fluxarte}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "8081:8080"
  frontend:
    build: ./frontend
    container_name: fluxarte-frontend
    depends_on:
      - app
    environment:
      API_PROXY_TARGET: http://app:8080
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - fluxarte-frontend-node-modules:/app/node_modules

volumes:
  fluxarte-db-data:
  fluxarte-frontend-node-modules:

spring.application.name=Fluxarte

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fluxarte}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:dev-secret-troque-em-producao-minimo-32-caracteres}
jwt.expiracao-ms=${JWT_EXPIRACAO_MS:900000}

logging.level.org.springframework.security=DEBUG
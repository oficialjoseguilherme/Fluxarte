spring.application.name=Fluxarte

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fluxarte}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

fluxarte.security.refresh-token.validade-dias=${REFRESH_TOKEN_VALIDADE_DIAS:30}
fluxarte.security.refresh-token.tamanho-bytes=${REFRESH_TOKEN_TAMANHO_BYTES:32}

fluxarte.recomendacao.max-itens=${RECOMENDACAO_MAX_ITENS:20}